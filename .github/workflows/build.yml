name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: unzip -q AccidentApp-14.zip
      - name: Make icon from logo
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          cd AccidentApp/app/src/main
          rsvg-convert icon.svg -o res/mipmap-xxxhdpi/ic_launcher.png
      - run: cd AccidentApp && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: AccidentApp/app/build/outputs/apk/debug/app-debug.apk
